{% load static %}
<!DOCTYPE html>
<html lang="tk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Talon - {{ ticket.ticket_number }}</title>
        <link rel="icon" type="image/x-icon" href="{% static 'img/Balans.ico' %}">
    <style>
        @page {
            size: 80mm auto;
            margin: 0;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            width: 72mm;
            margin: 0 auto;
            padding: 10px 0;
            text-align: center;
            color: #000;
        }
        .header { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .sub-header { font-size: 12px; border-bottom: 1px dashed #000; padding-bottom: 5px; }
        .ticket-number { font-size: 48px; font-weight: bold; margin: 15px 0 5px 0; }
        .service { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .counter-box { font-size: 16px; font-weight: bold; background: #000; color: #fff; padding: 5px; margin: 10px 0; border-radius: 4px; }
        .info { font-size: 11px; margin-top: 5px; }
        .footer { font-size: 11px; border-top: 1px dashed #000; margin-top: 10px; padding-top: 5px; }

        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="header">«Türkmentelekom»</div>
    <div class="sub-header">Elektron nobat ulgamy</div>

    <div class="service">Hyzmat: Balans doldurmak</div>
    
    <div class="ticket-number">{{ ticket.ticket_number }}</div>

    <div class="counter-box">
        Kassa: № 14
    </div>

    <div class="info">
        Siziň öňüňizde: <strong>{{ waiting_ahead }} adam bar</strong>
    </div>
    <div class="info">Sene: {{ ticket.created_at|date:"d.m.Y H:i:s" }}</div>

    <div class="footer">
        Garaşmagyňyzy haýyş edýäris!<br>
        Sag boluň!
    </div>

    <br>
    <div class="no-print">
        <button onclick="printAndPlayAudio()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Çap etmek we Ses</button>
        <a href="{% url 'Balans_ticket' %}" style="margin-left: 10px; color: #000; text-decoration: none;">Yza</a>
    </div>

    <script>
        function redirectToHome() {
            window.location.href = "{% url 'Balans_ticket' %}";
        }

        function printAndPlayAudio() {
            let ticketNumber = "{{ ticket.ticket_number }}";   
            let audioDir = "/static/audio/";
            let playlist = [];

            let cleanNumber = ticketNumber.replace(/[\s_]/g, '').trim();

            playlist.push(audioDir + cleanNumber + ".mp3");

            playlist.push(audioDir + "Balans doldurmak .mp3"); 

            console.log("Pleýlist:", playlist);

            playFastQueue(playlist, function() {
                console.log("Sesler gutardy, peçat açylýar...");
                setTimeout(function() {
                    window.print();
                }, 100);
            });

            window.onafterprint = function() {
                redirectToHome();
            };
        }

        const globalAudio = new Audio();

        function playFastQueue(files, onComplete) {
            if (files.length === 0) {
                if (typeof onComplete === 'function') onComplete();
                return;
            }

            let audioFile = files.shift();
            globalAudio.src = audioFile;
            globalAudio.load();

            globalAudio.onended = function() {
                playFastQueue(files, onComplete);
            };

            globalAudio.play().catch(error => {
                console.log("Ýalňyşlyk: ", audioFile, error);
                playFastQueue(files, onComplete);
            });
        }
    </script>
        <script>
            document.addEventListener('keydown', function(event) {
                if (
                    event.key === 'F12' || 
                    (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j')) ||
                    (event.ctrlKey && (event.key === 'U' || event.key === 'u'))
                ) {
                    event.preventDefault();
                    return false;
                }
            });

            document.addEventListener('contextmenu', function(event) {
                event.preventDefault();
            });
        </script>
    <script>
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };
</script>
</body>
</html>
