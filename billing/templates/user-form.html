{% load static %}
<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>«Marytelekom» — Elektron nobat terminaly</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/Balans.ico' %}">
    <!-- FontAwesome ikonalary -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: #0056b3;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .header p {
            color: #6c757d;
            font-size: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .services-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .service-btn {
            color: white;
            border: none;
            padding: 25px 30px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .service-btn:hover {
            transform: translateY(-3px);
            filter: brightness(0.95);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .service-btn .icon {
            font-size: 32px;
        }

        .footer {
            margin-top: 35px;
            color: #adb5bd;
            font-size: 15px;
            text-align: center;
        }
        .header h1 img {
            height: 60px;
            vertical-align: middle;
            margin-right: 10px;
        }
        a{
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
  <div class="header">
        <h1><a href="{% url 'index' %}">«Marytelekom»</a></h1>
    </div>
    
    <div class="container">
        <form method="POST" action="" class="services-grid">
            {% csrf_token %}

            <button type="submit" name="service_type" value="Balans doldurmak" class="service-btn" style="background-color: #007bff;">
                <span id="btn1">Balans doldurmak</span>
                <span class="icon"><i class="fa-solid fa-wallet"></i></span>
            </button>

        </form>
    </div>

    <div class="footer" id="footerText">
        Abonentlere hyzmat ediş bölümi © 2026
    </div>
        <script>
            document.addEventListener('keydown', function(event) {
                if (
                    event.key === 'F12' || 
                    (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j')) ||
                    (event.ctrlKey && (event.key === 'U' || event.key === 'u'))
                ) {
                    event.preventDefault();
                    return false;
                }
            });

            document.addEventListener('contextmenu', function(event) {
                event.preventDefault();
            });
        </script>
        <script>
            history.pushState(null, null, location.href);
            window.onpopstate = function () {
                history.go(1);
            };
        </script>
</body>
</html>
