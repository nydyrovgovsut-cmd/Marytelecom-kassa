{% load static %}
<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}«Marytelekom» — Operator panel{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/Turkmentelecomkassa.ico' %}">
    
    <!-- FontAwesome ikonalary -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #0056b3;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header h1 img {
            height: 50px;
            vertical-align: middle;
            margin-right: 10px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .info-text {
            font-size: 18px;
            color: #495057;
            margin-bottom: 20px;
        }

        .ticket-display {
            background: #e9ecef;
            padding: 25px;
            border-radius: 12px;
            font-size: 48px;
            font-weight: 700;
            color: #0056b3;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .btn-next {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-next:hover {
            background-color: #218838;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 25px;
            color: #adb5bd;
            font-size: 14px;
            text-align: center;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <div class="container">
        {% block content %}
        <!-- Her operator paneliň zatlary şu ýerde görünýä -->
        {% endblock %}
    </div>

    <div class="footer">
        Abonentlere hyzmat ediş bölümi © 2026
    </div>

    <script>
        document.addEventListener('keydown', function(event) {
            if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i'))) {
                event.preventDefault();
                return false;
            }
        });
        document.addEventListener('contextmenu', function(event) { event.preventDefault(); });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
